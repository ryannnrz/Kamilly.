<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feliz aniversário, meu amor!</title>
<meta name="theme-color" content="#f6e1e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b5555d' d='M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* Paleta: troque aqui as cores do site inteiro */
:root{--cr:#f7efe4;--cr2:#fbf6ee;--rs:#f6e1e0;--ra:#c98c93;--vm:#b5555d;--bg:#e6d5bf;--mr:#5a3e3a;--vd:#8a9a7b;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--script:'Pinyon Script','Snell Roundhand',cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--cr) radial-gradient(rgba(90,62,58,.06) 1px,transparent 1px) 0 0/5px 5px;color:var(--mr);font:400 1.15rem/1.7 var(--serif);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--vm);outline-offset:3px}
section{position:relative;padding:5rem 1.25rem;overflow:hidden}
.w{max-width:620px;margin:auto;position:relative}
.alt{background:var(--rs)}.alt2{background:var(--cr2)}
h2{font:italic 500 clamp(1.9rem,7.5vw,2.7rem)/1.15 var(--serif);text-align:center;margin-bottom:2.4rem}
h2::after{content:'';display:block;height:1px;width:0;margin:1rem auto 0;background:linear-gradient(90deg,transparent,var(--ra),transparent);transition:width 1.3s .35s cubic-bezier(.2,.8,.2,1)}
h2.in::after{width:150px}
h3{font:italic 600 1.4rem/1.2 var(--serif);color:var(--vm);margin-bottom:.4rem}

/* enfeites florais: crescem aos poucos quando a seção aparece e têm leve paralaxe */
.sprig{position:absolute;width:110px;height:110px;pointer-events:none;opacity:0;scale:.55;transition:opacity 1.4s .15s,scale 1.8s .15s cubic-bezier(.2,.8,.2,1)}
section.vis .sprig{opacity:.9;scale:1}
.tl{top:0;left:0}.tr{top:0;right:0;transform:scaleX(-1)}.br{bottom:30px;right:0;transform:rotate(180deg)}

.btn{font:500 .95rem var(--sans);padding:.9rem 1.9rem;min-height:48px;background:var(--vm);color:#fff;border-radius:99px;box-shadow:0 6px 18px rgba(181,85,93,.3);transition:transform .3s;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.96)}
.btn .bi{width:16px;height:16px;fill:currentColor;margin-right:.55rem}
.ph{background:linear-gradient(135deg,var(--rs),var(--bg));display:grid;place-items:center;aspect-ratio:4/5;font:300 .68rem var(--sans);padding:.6rem;text-align:center;word-break:break-all;color:var(--vm)}

/* entradas: desfoque suave + deslize + leve zoom (rápidas, nunca bloqueiam a rolagem) */
.rv{opacity:0;translate:0 28px;scale:.97;filter:blur(5px);transition:opacity .9s ease,translate .9s cubic-bezier(.2,.75,.2,1),scale .9s cubic-bezier(.2,.75,.2,1),filter .9s}
.rv.l{translate:-36px 0}.rv.r{translate:36px 0}.rv.z{translate:0 0;scale:.9}
.rv.in{opacity:1;translate:none;scale:none;filter:none}

/* ondas e festões entre as seções */
.wv{position:relative;height:35px;margin-top:-34px;pointer-events:none}
.wv i{display:block;height:100%;background:var(--c);-webkit-mask-image:var(--wave);mask-image:var(--wave);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.wv.s i{-webkit-mask-image:var(--scal);mask-image:var(--scal)}

#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--vm);transform:scaleX(0);transform-origin:left;z-index:30}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#petals i{position:absolute;top:-20px;width:12px;height:16px;background:var(--ra);opacity:.3;border-radius:80% 0;animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,0) rotate(0) scale(var(--s))}to{transform:translate(70px,112vh) rotate(540deg) scale(var(--s))}}
@keyframes foc{from{opacity:0;filter:blur(10px);transform:scale(.96)}}

/* camada das celebrações (confete, pétalas, corações) */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:35}
#fx i,#fx svg{position:absolute;opacity:0}
#fx .pt{top:-24px;border-radius:80% 0 80% 0;box-shadow:inset 0 0 4px rgba(255,255,255,.45)}

/* 1 abertura */
.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(var(--rs),var(--cr) 70%)}
.hw{display:flex;flex-direction:column;align-items:center;gap:1.5rem;position:relative;isolation:isolate}
.hw::before{content:'';position:absolute;inset:-12% -8%;background:radial-gradient(closest-side,rgba(255,255,255,.6),transparent);z-index:-1}
.hero h1{font:400 clamp(3.6rem,19vw,8rem)/1.04 var(--script);color:#a8444d;text-shadow:0 1px 0 rgba(255,255,255,.55),0 8px 30px rgba(181,85,93,.3);text-wrap:balance;animation:foc 2.2s both}
.lead{font-style:italic;font-size:1.3rem;max-width:20em;animation:foc 2s 1s both}
.hero .btn{position:relative;overflow:hidden;animation:foc 2s 1.8s both,breath 3.2s 4s ease-in-out infinite}
.hero .btn::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);translate:-120% 0;animation:shine 3.8s 4.6s infinite}
.hero .btn.pop{animation:popb .6s ease}
@keyframes breath{50%{box-shadow:0 6px 18px rgba(181,85,93,.3),0 0 0 14px rgba(181,85,93,.1)}}
@keyframes shine{40%,100%{translate:120% 0}}
@keyframes popb{30%{scale:.92}60%{scale:1.08}100%{scale:1}}

/* 2 foto principal (polaroid) */
.pol{background:#fffdf8;padding:.7rem .7rem 2.8rem;box-shadow:0 10px 28px rgba(90,62,58,.18);position:relative;border-radius:3px}
.pol::before{content:'';position:absolute;top:-12px;left:50%;width:90px;height:26px;margin-left:-45px;background:rgba(228,208,170,.85);transform:rotate(-3deg)}
.pol img,.pol .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.pol figcaption{position:absolute;bottom:.9rem;left:0;right:0;text-align:center}
.big{transform:rotate(-1.5deg);max-width:440px;margin:auto;padding-bottom:5.6rem;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.big figcaption{line-height:1}
.cap1{display:block;font:400 2.2rem/1.05 var(--script);color:var(--vm)}
.cap2{display:block;font:italic 500 1.2rem/1.3 var(--serif);margin-top:.2rem}
.big img,.big .ph{transition:filter 2.4s .5s ease}
.big.rv:not(.in) img,.big.rv:not(.in) .ph{filter:saturate(.3) blur(6px) brightness(1.15)}
.tap{position:absolute;top:1.15rem;right:1.15rem;width:34px;height:34px;border-radius:50%;background:rgba(255,253,248,.88);display:grid;place-items:center;box-shadow:0 2px 8px rgba(90,62,58,.2);animation:pulse 2.2s ease-in-out infinite}
.tap svg{width:16px;fill:var(--vm)}.big.done .tap{display:none}
@keyframes pulse{50%{scale:1.16}}
.sm2{max-width:280px;margin:1rem auto 0;padding-bottom:.7rem}

/* 3 carta */
.paper{background:#fffdf8 repeating-linear-gradient(transparent 0 1.95rem,rgba(201,140,147,.22) 1.95rem calc(1.95rem + 1px));padding:2rem 1.4rem;line-height:1.95rem;font-size:1.2rem;box-shadow:0 10px 30px rgba(90,62,58,.12);border-left:3px double var(--ra)}
.paper p{margin-bottom:1.95rem}.sign{font:400 2rem/1.1 var(--script);color:var(--vm);text-align:right}

/* 4 coisas que eu amo em você: três molduras diferentes */
.lv{position:relative;margin:0 auto 4.4rem}
.lv .px{position:relative}
.fw{position:relative}
.fr{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--rs)}
.fr img,.fr .ph{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
.lv h3{font:400 2.5rem/1.1 var(--script);color:var(--vm);margin:1.3rem 0 0;text-align:center}
.mini{position:absolute;width:76px;height:76px;pointer-events:none;opacity:.9;z-index:1}
/* 1 arco */
.lv1 .px{width:min(78%,290px);margin:0 auto}
.lv1 .fw{padding:9px;background:#fffdf8;border-radius:999px 999px 16px 16px;box-shadow:0 0 0 7px var(--rs),0 0 0 8px rgba(201,140,147,.5),0 18px 36px rgba(90,62,58,.18)}
.lv1 .fr{border-radius:999px 999px 10px 10px}
.lv1 .mini{top:-20px;right:-4%}
/* 2 polaroid inclinada, alinhada à direita */
.lv2 .px{width:min(84%,320px);margin:0 0 0 auto;transform:rotate(2deg)}
.lv2 .fw{background:#fffdf8;padding:.7rem .7rem 4rem;box-shadow:0 12px 30px rgba(90,62,58,.2)}
.lv2 .fw::before{content:'';position:absolute;top:-12px;left:50%;width:90px;height:26px;margin-left:-45px;background:rgba(201,140,147,.45);transform:rotate(-3deg);z-index:1}
.lv2 .fr{aspect-ratio:5/6}
.lv2 h3{margin:-3.5rem 0 0;position:relative}
.lv2 .mini{bottom:-26px;left:-14%;transform:scaleX(-1) rotate(-20deg)}
/* 3 oval com anel dourado */
.lv3 .px{width:min(76%,290px);margin:0 auto}
.lv3 .fw{padding:10px;background:#fffdf8;border-radius:50%;box-shadow:0 0 0 6px var(--cr2),0 0 0 7px #d9b869,0 18px 36px rgba(90,62,58,.18)}
.lv3 .fr{border-radius:50%}
.lv3 .mini{bottom:34px;left:-18%;transform:rotate(-8deg)}

/* 5 playlist (inspirada em apps de música) */
.dark{background:linear-gradient(#4a3330,#33211f);color:var(--cr)}.dark h2{color:var(--rs)}
.plh{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.5rem}
.plc{position:relative;width:min(64vw,230px);aspect-ratio:1;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.45);background:linear-gradient(145deg,#e9b8bd,#c98c93 45%,#8c3b45)}
.plc .hg{position:absolute;left:50%;top:44%;width:56%;margin:-28% 0 0 -28%;fill:rgba(255,246,238,.9);filter:drop-shadow(0 6px 14px rgba(90,40,48,.35))}
.plc .sp{position:absolute;left:-6%;top:-6%;width:46%;height:46%;opacity:.9}
.plc .t{position:absolute;bottom:.7rem;left:0;right:0;text-align:center;font:400 1.9rem/1 var(--script);color:var(--cr2)}
.plc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pln{font:italic 600 clamp(2rem,9vw,2.6rem)/1.1 var(--serif);color:#fff6ee}
.pld{font:300 .92rem/1.55 var(--sans);opacity:.88;max-width:34em}
.pla{font:300 .8rem var(--sans);opacity:.7}
.plrow{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.pbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--ra);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .25s}
.pbtn:active{transform:scale(.94)}.pbtn svg{width:24px;fill:#3a2523}
.pa{display:none}.playing .gl .pa{display:block}.playing .gl .pl{display:none}
#player{background:rgba(255,255,255,.07);border:1px solid rgba(246,225,224,.12);border-radius:20px;padding:1rem 1.1rem 1rem;margin-bottom:1.4rem}
.np{display:flex;align-items:center;gap:.9rem}.np .cv{width:60px;height:60px}.np .tn b{font-size:1.3rem}
#pl-msg{font:300 .78rem var(--sans);color:var(--rs);min-height:1.2rem;margin:.3rem 0 .1rem}
#pl-r{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
#pl-r::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ra) var(--p),rgba(255,255,255,.22) var(--p))}
#pl-r::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--rs);box-shadow:0 1px 6px rgba(0,0,0,.4)}
#pl-r::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.22)}
#pl-r::-moz-range-progress{height:4px;border-radius:4px;background:var(--ra)}
#pl-r::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--rs)}
.tm{display:flex;justify-content:space-between;font:300 .75rem var(--sans);opacity:.75}
.ct{display:flex;justify-content:center;align-items:center;gap:1.8rem;margin-top:.3rem}
.ct button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ct svg{width:22px;fill:var(--cr)}
.ct .pp{background:var(--ra);width:60px;height:60px}.ct .pp svg{fill:#3a2523}
.trks{list-style:none;padding:0;display:grid;gap:.25rem}
.row{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:.55rem .6rem;border-radius:12px;transition:background .3s}
.row:active{background:rgba(255,255,255,.06)}.trk.on .row{background:rgba(201,140,147,.2)}
.cv{position:relative;flex:none;width:56px;height:56px;border-radius:8px;overflow:hidden;background:linear-gradient(145deg,#c98c93,#7a3640);display:grid;place-items:center}
.cv svg{width:22px;fill:rgba(255,246,238,.75)}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px;background:rgba(40,24,22,.55)}
.trk.on .eq{display:flex}
.eq i{width:4px;height:16px;background:var(--rs);border-radius:2px;transform-origin:bottom;transform:scaleY(.3)}
.playing .trk.on .eq i{animation:eq 1s ease-in-out infinite}.playing .trk.on .eq i:nth-child(2){animation-delay:-.4s}.playing .trk.on .eq i:nth-child(3){animation-delay:-.75s}
@keyframes eq{50%{transform:scaleY(1)}}
.tn{flex:1;min-width:0}.tn b{display:block;font:italic 600 1.2rem/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk.on .tn b{color:var(--rs)}
.tn small{display:block;font:300 .8rem var(--sans);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(246,225,224,.35);display:grid;place-items:center}.rb svg{width:16px;fill:var(--cr)}
.trk.on .rb{background:var(--ra);border-color:var(--ra)}.trk.on .rb svg{fill:#3a2523}
.playing .trk.on .pa{display:block}.playing .trk.on .pl{display:none}

/* 6 galeria scrapbook */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:2.2rem 1rem;align-items:start}
.gi{display:block;width:100%;text-align:inherit}
.gi .pol{padding:.6rem .6rem 1.7rem}
.gi:nth-child(6n+1){grid-column:1/span 4;transform:rotate(-2deg)}
.gi:nth-child(6n+2){grid-column:3/span 4;transform:rotate(2deg)}.gi:nth-child(6n+2) img,.gi:nth-child(6n+2) .ph{aspect-ratio:1}
.gi:nth-child(6n+3){grid-column:2/span 3;transform:rotate(-1.5deg)}.gi:nth-child(6n+3) img,.gi:nth-child(6n+3) .ph{aspect-ratio:3/4}
.gi:nth-child(6n+4){grid-column:1/span 6;transform:rotate(1.2deg)}.gi:nth-child(6n+4) img,.gi:nth-child(6n+4) .ph{aspect-ratio:4/3}.gi:nth-child(6n+4) .pol::before{background:rgba(201,140,147,.45)}
.gi:nth-child(6n+5){grid-column:1/span 3;transform:rotate(2.5deg)}.gi:nth-child(6n+5) img,.gi:nth-child(6n+5) .ph{aspect-ratio:3/4}.gi:nth-child(6n+5) .pol::before{background:rgba(169,183,154,.55)}
.gi:nth-child(6n){grid-column:4/span 3;transform:rotate(-2.5deg);margin-top:1.8rem}
.gi:nth-child(6n+3) .pol::before,.gi:nth-child(6n) .pol::before{width:22px;height:22px;margin-left:-11px;top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d68a,#b88a2e);transform:none;box-shadow:0 2px 4px rgba(0,0,0,.3)}
#lb{position:fixed;inset:0;margin:0;background:rgba(58,38,36,.94);display:grid;place-items:center;z-index:50;padding:1rem;color:var(--cr);text-align:center;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
#lb.on{opacity:1;visibility:visible;transition:opacity .4s}
#lb-f{transform:scale(.9);transition:transform .55s cubic-bezier(.2,.8,.2,1)}#lb.on #lb-f{transform:none}
#lb img,#lb .ph{max-width:100%;max-height:80vh;margin:auto;display:block;background:#fffdf8;border:10px solid #fffdf8;border-bottom-width:26px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#lb .ph{width:min(80vw,420px);color:var(--vm)}
#lb-x{position:absolute;top:max(.6rem,env(safe-area-inset-top));right:.8rem;width:48px;height:48px;font-size:2.2rem;color:var(--cr)}
.lbn{position:absolute;top:50%;width:48px;height:60px;margin-top:-30px;font-size:2.6rem;line-height:1;color:var(--cr);z-index:2}#lb-p{left:.1rem}#lb-n{right:.1rem}

/* 7 envelopes (mantidos da versão anterior) */
.envs{display:grid;gap:1.2rem}
.front{position:relative;display:block;width:100%;min-height:120px;background:var(--bg);border-radius:4px;font:italic 1.25rem/1.3 var(--serif);padding:3rem 1rem 1.2rem;overflow:hidden;box-shadow:0 6px 16px rgba(90,62,58,.12)}
.flap{position:absolute;inset:0 0 auto;height:72%;background:#d8c3a6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.seal{position:absolute;left:50%;top:52%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--vm);transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg)}.env.open .seal{opacity:0}
.msg{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s}.env.open .msg{grid-template-rows:1fr}.msg>div{overflow:hidden}
.msg p{background:#fffdf8;margin-top:.5rem;padding:1.3rem;border-radius:3px;border-left:3px solid var(--ra);font-style:italic}

/* 8 futuro / 9 final */
.fut{background:linear-gradient(var(--cr2),var(--rs));text-align:center}.fp p{margin-bottom:1.4rem;font-size:1.3rem;font-style:italic;line-height:1.9}
.end{text-align:center;background:var(--rs);padding-bottom:6rem}.quote{font:italic 500 clamp(1.6rem,6.5vw,2.3rem)/1.35 var(--serif);margin-bottom:1.6rem}
.to{font:400 2rem/1.1 var(--script);color:var(--vm);margin-bottom:1rem}
.hb{width:44px;fill:var(--vm);animation:beat 1.8s ease-in-out infinite;margin:.4rem 0}@keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.end .sign{text-align:center;margin-top:.6rem}

.paper .hi{font:400 1.9rem/1.95rem var(--script);color:var(--vm)}
.paper .fec{font:400 2.1rem/1.95rem var(--script);color:var(--vm);text-align:center}
#s9 .paper .sign,#s9b .paper .sign{line-height:2.3rem;margin-bottom:0}

/* textos de apoio ao redor das seções */
.intro,.outro{font:italic 400 1.25rem/1.7 var(--serif);text-align:center;max-width:27em;margin-inline:auto}
.intro{margin-top:-1.3rem;margin-bottom:2.6rem}
.outro{margin-top:2.6rem}
.outro.up{margin-top:-1.6rem}
.outro::before{content:'';display:block;width:60px;height:1px;margin:0 auto 1.2rem;background:linear-gradient(90deg,transparent,var(--ra),transparent)}
.dark .outro{color:var(--rs)}

/* extras */
.sec{position:absolute;width:44px;height:44px;display:grid;place-items:center;opacity:.35;z-index:3}.sec svg{width:15px;fill:var(--vm)}.sec:hover{opacity:.9}
.a{bottom:1.2rem;right:.8rem}.b{bottom:.8rem;left:.6rem}.c{top:1.2rem;right:.8rem}.d{bottom:4rem;right:.8rem}
#toast{position:fixed;left:50%;bottom:5rem;transform:translate(-50%,20px);background:var(--mr);color:var(--cr);padding:.9rem 1.3rem;border-radius:14px;font:italic 1.05rem/1.4 var(--serif);max-width:88vw;opacity:0;pointer-events:none;transition:.5s;z-index:40;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#top{position:fixed;right:1rem;bottom:max(1rem,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--cr2);color:var(--vm);box-shadow:0 4px 14px rgba(90,62,58,.25);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.4s;z-index:30}#top.on{opacity:1;pointer-events:auto}
#mini{position:fixed;left:.8rem;right:4.2rem;bottom:max(1rem,env(safe-area-inset-bottom));display:flex;align-items:center;background:var(--mr);color:var(--cr);border-radius:99px;padding:.15rem .3rem .15rem 1rem;z-index:30;opacity:0;pointer-events:none;transform:translateY(12px);transition:.4s}
#mini.on{opacity:1;pointer-events:auto;transform:none}#mn{flex:1;min-width:0;text-align:left;font:300 .85rem var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}#mp{width:44px;height:44px;display:grid;place-items:center;color:var(--rs)}

/* última foto sozinha numa linha incompleta: fica centralizada e em paisagem (só no celular) */
@media(max-width:899px){.gi:nth-child(6n+5):last-child{grid-column:1/span 6;transform:rotate(-1.2deg)}.gi:nth-child(6n+5):last-child img,.gi:nth-child(6n+5):last-child .ph{aspect-ratio:4/3}}
@media(min-width:900px){.w{max-width:960px}.envs{grid-template-columns:1fr 1fr}.paper,.fp{max-width:640px;margin-inline:auto}.sprig{width:170px;height:170px}
.gal{grid-template-columns:repeat(3,1fr)}.gi:nth-child(n){grid-column:auto;margin-top:0}.gi:nth-child(3n+2){margin-top:2.5rem}.plh,#player,.trks{max-width:600px;margin-inline:auto}.lv{max-width:520px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}.rv{opacity:1;translate:none;scale:none;filter:none}.sprig{opacity:.9;scale:1}#petals{display:none}}

/* login */
#lg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:linear-gradient(var(--rs),var(--cr) 70%);transition:opacity .9s,filter .9s,visibility .9s;overflow:hidden}
#lg.out{opacity:0;filter:blur(8px);visibility:hidden;pointer-events:none}
#lg .sprig{opacity:.9;scale:1}
#lg form{position:relative;isolation:isolate;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center;padding:2.2rem 1.5rem;animation:foc 1.6s both}
#lg form::before{content:'';position:absolute;inset:-10% -6%;background:radial-gradient(closest-side,rgba(255,255,255,.65),transparent);z-index:-1}
#lg h1{font:400 clamp(3rem,15vw,4.6rem)/1.05 var(--script);color:#a8444d;text-shadow:0 1px 0 rgba(255,255,255,.55),0 8px 30px rgba(181,85,93,.3)}
#lg .lead{animation:none;font-size:1.2rem}
#lg label{width:100%;text-align:left;font:500 .8rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--vm)}
#lg input{display:block;width:100%;margin-top:.35rem;min-height:48px;padding:.7rem 1.1rem;font:400 1.1rem var(--serif);color:var(--mr);background:#fffdf8;border:1px solid var(--ra);border-radius:99px;box-shadow:0 4px 14px rgba(90,62,58,.08)}
#lg input:focus{outline:2px solid var(--vm);outline-offset:2px}
#lg .btn{margin-top:.4rem;width:100%}
#lg-e{min-height:1.4em;font:italic 1.05rem var(--serif);color:var(--vm)}
#lg.err form{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="sprig" viewBox="0 0 120 120"><path d="M20 110C40 80 60 50 100 14" fill="none" stroke="#8a9a7b" stroke-width="1.5"/><g fill="#a9b79a"><ellipse cx="38" cy="86" rx="10" ry="4" transform="rotate(-40 38 86)"/><ellipse cx="58" cy="62" rx="10" ry="4" transform="rotate(-50 58 62)"/><ellipse cx="78" cy="42" rx="9" ry="3.5" transform="rotate(-55 78 42)"/></g><g fill="#ecbfc3"><circle cx="100" cy="14" r="7"/><circle cx="88" cy="27" r="5"/><circle cx="70" cy="53" r="5"/></g><circle cx="100" cy="14" r="2.5" fill="#c98c93"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 2c.6 5 2.4 8.4 10 10-7.6 1.6-9.4 5-10 10-.6-5-2.4-8.4-10-10 7.6-1.6 9.4-5 10-10z"/></symbol></defs></svg>
<div id="lg" role="dialog" aria-modal="true" aria-label="Entrar"><svg class="sprig tl" aria-hidden="true"><use href="#sprig"/></svg><svg class="sprig br" aria-hidden="true"><use href="#sprig"/></svg>
<form id="lg-f" autocomplete="off"><h1>Olá, meu amor</h1><p class="lead">Digite seu usuário e senha para entrar</p>
<label>Usuário<input id="lg-u" type="text" autocapitalize="words" autocomplete="username" required></label>
<label>Senha<input id="lg-p" type="password" autocomplete="current-password" required></label>

<button class="btn" type="submit"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>Entrar</button></form></div>
<main></main>
<figure id="lb" role="dialog" aria-modal="true" aria-label="Foto ampliada"><button id="lb-x" aria-label="Fechar">&times;</button><button id="lb-p" class="lbn" aria-label="Foto anterior">&lsaquo;</button><button id="lb-n" class="lbn" aria-label="Próxima foto">&rsaquo;</button><div id="lb-f"></div></figure>
<div id="mini"><button id="mn" data-go="#s5"></button><button id="mp" aria-label="Pausar"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg></button></div>
<div id="toast" role="status"></div>
<button id="top" aria-label="Voltar ao topo"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5l-7 8h4v6h6v-6h4z" fill="currentColor"/></svg></button>
<script>
/* ==========================================================
   SITE_DATA — TUDO que você precisa editar está aqui.
   Textos aceitam HTML simples (<br>, <em>).
   Fotos: coloque em assets/images/  |  Músicas: coloque em assets/music/
   Se uma foto ainda não existir, aparece um espaço reservado com o caminho dela.
   ========================================================== */
const KAMILLY = "Kamilly";   // nome dela
const RYAN = "Ryan";         // seu nome (autor da homenagem)

const SITE_DATA = {
  kamilly: KAMILLY,
  ryan: RYAN,
  assinatura: `Com amor, ${RYAN}.`,   // usada no fim da carta e no final do site

  /* ---------- 1. TELA INICIAL ---------- */
  abertura: {
    titulo: "Feliz aniversário, meu amor!",
    texto: "Hoje é seu dia, e estive trabalhando em uma surpresa especial para você.",
    botao: "Abrir meu presente"
  },

  /* ---------- 2. FOTOGRAFIA PRINCIPAL ----------
     >>> TROQUE A FOTO: coloque o arquivo em assets/images/ e ajuste o caminho em "src".
     "legenda" tem 2 linhas (a primeira em letra cursiva, a segunda em itálico). */
  foto: {
    src: "assets/images/foto-principal.jpg",
    legenda: ["Meu bem mais precioso!", "Você, meu amor."],
    texto: "Cada detalhe deste site foi pensado em você. Vá rolando com calma, meu amor: tem muita coisa guardada aqui com todo o carinho do mundo."   // texto abaixo da foto
  },

  /* ---------- 3. CARTA ---------- (1 item = 1 parágrafo) */
  carta: {
    titulo: "Uma mensagem para você",
    intro: "Antes de qualquer coisa, quero te dizer algumas palavras que moram no meu coração.",
    paragrafos: [
      "Hoje é o dia de celebrar a pessoa mais especial da minha vida. Olhando para trás, sinto um orgulho imenso da mulher incrível em que você se tornou: forte, inteligente, bondosa e dona de um coração gigante. Cada conquista sua é motivo de admiração para mim e sempre estarei com você para o que precisar.",
      "Eu te amo de um jeito que as palavras mal conseguem explicar. O meu maior e mais sincero desejo é passar o resto dos meus dias ao seu lado, construindo uma vida juntos, rindo dos mesmos momentos e apoiando um ao outro em cada passo."
    ]
  },

  /* ---------- 4. COISAS QUE EU AMO EM VOCÊ ----------
     >>> TROQUE AS 3 FOTOS: ajuste o caminho em "foto" de cada item (proporção ideal: retrato 4:5).
     Só o título aparece junto da foto — não há descrição. */
  amo: {
    titulo: "Coisas que eu amo em você.",
    intro: "Existem coisas em você que eu poderia olhar por horas sem me cansar. Separei algumas delas aqui.",
    fim: "E essas são só algumas. A lista completa não cabe em nenhum site.",
    itens: [
      { titulo: "Seu cabelo",      foto: "assets/images/amo-cabelo.jpg" },    // <- foto 1
      { titulo: "Seu sorriso",     foto: "assets/images/amo-sorriso.jpg" },   // <- foto 2
      { titulo: "Seu jeito meigo", foto: "assets/images/amo-meigo.jpg" }     // <- foto 3
    ]
  },

  /* ---------- 5. PLAYLIST ----------
     >>> ADICIONAR MÚSICA: copie um bloco { ... } da lista "itens", coloque o MP3 em assets/music/

     "capa" da playlist: se a imagem não existir, aparece uma capa desenhada com o nome da playlist. */
  playlist: {
    titulo: "Músicas que me lembram você",
    nome: "Me lembram você",
    descricao: "Músicas que me lembram você sempre que tocam. Toque em qualquer uma para ouvir.",
    fim: "Sempre que uma delas toca, é em você que eu penso.",
    autor: `Feita por ${RYAN} para ${KAMILLY}`,
    capa: "assets/images/capa-playlist.jpg",     // <- capa principal da playlist (opcional)
    itens: [
      { nome: "Me Namora", artista: "Edu Ribeiro & Banda Cativeiro", capa: "assets/images/capa-me-namora.jpg", arquivo: "assets/music/me-namora.mp3" },
      { nome: "Monalisa",  artista: "Jorge Vercilo",                 capa: "assets/images/capa-monalisa.jpg",  arquivo: "assets/music/monalisa.mp3" }
      // para mais músicas: copie uma linha acima, cole embaixo (com vírgula) e troque os dados
    ]
  },

  /* ---------- 6. GALERIA ----------
     >>> TROQUE / ADICIONE FOTOS: cada linha é uma foto. Para adicionar, copie uma linha e mude o caminho.
     O layout se reorganiza sozinho. Não há legendas. */
  galeria: {
    titulo: "Fotos suas que eu mais amo.",
    intro: "Cada foto aqui é um pedacinho do que eu mais gosto de olhar. Toque em qualquer uma para ampliar.",
    fim: "Mesmo assim, nenhuma foto consegue mostrar o quanto você é linda pessoalmente.",
    fotos: [
      "assets/images/galeria1.jpg",
      "assets/images/galeria2.jpg",
      "assets/images/galeria3.jpg",
      "assets/images/galeria4.jpg",
      "assets/images/galeria5.jpg",
      "assets/images/galeria6.jpg",
      "assets/images/galeria7.jpg",
      "assets/images/galeria8.jpg",
      "assets/images/galeria9.jpg",
      "assets/images/galeria10.jpg",
      "assets/images/galeria11.jpg"
    ]
  },

  /* ---------- 7. ENVELOPES (mantido da versão anterior) ---------- */
  envelopes: { titulo: "Pequenos motivos para sorrir",
    intro: "Guardei alguns bilhetes para os momentos em que você precisar. Toque em cada envelope para abrir.",
    itens: [
    { titulo: "Abra quando estiver com saudade", mensagem: "Eu sei como é, porque aqui também aperta. Feche os olhos, respire fundo e lembre que você está nos meus pensamentos o dia inteiro. Assim que eu puder, vou correndo falar com você, como sempre faço." },
    { titulo: "Abra quando precisar sorrir", mensagem: "Lembra quando nós dois negávamos o que estava acontecendo? Ainda bem que o coração não ouviu nenhum de nós. Se isso não te arrancou um sorriso, leia de novo!" },
    { titulo: "Abra quando quiser lembrar o quanto é especial", mensagem: "Você é guerreira, carinhosa, companheira, leal e linda. Isso não é exagero meu: é o que eu enxergo em você todos os dias. Nunca duvide do tamanho que você tem." },
    { titulo: "Abra quando precisar de um carinho", mensagem: "Fica aqui o meu abraço, bem apertado, desses que arrumam o dia inteiro. Você não precisa dar conta de tudo sozinha: eu estou do seu lado, sempre." },
    { titulo: "Abra quando a rotina estiver pesada", mensagem: "Eu sei que os nossos dias são corridos e bem diferentes, mas cada mensagem trocada no meio da correria vale muito para mim. Respire fundo: o cansaço de hoje faz parte do caminho que estamos construindo juntos, passo a passo." },
    { titulo: "Abra quando pensar no nosso futuro", mensagem: "Eu não sei exatamente como vai ser, mas sei o que eu quero: você ao meu lado. Quero você na minha entrada na EFOMM e quero estar na sua formatura. Se Deus quiser, vamos chegar lá juntos." }
  ]},

  /* ---------- 8. FUTURO (mantido da versão anterior) ---------- */
  futuro: { titulo: "Que venham muitos outros momentos...", paragrafos: [
    "Eu fico imaginando os próximos aniversários, as conquistas que ainda vêm por aí e todas as conversas que ainda temos pela frente. Em cada uma dessas cenas, eu vejo você.",
    "Para o seu novo ciclo, desejo que a vida seja tão gentil com você quanto você é com ela.",
    "Que ele venha cheio de saúde, paz e realizações, e que você nunca esqueça que tem alguém torcendo por você em cada passo.",
    "E que, se Deus quiser, a gente se encontre nos dois dias que mais sonho: a minha entrada na EFOMM e a sua formatura, com você ao meu lado."
  ]},

  /* ---------- 9. CARTA FINAL ----------
     O texto longo da carta do Ryan. 1 item em "paragrafos" = 1 parágrafo. */
  cartaFinal: {
    titulo: "O que eu queria te dizer de verdade.",
    saudacao: "Oi, meu amor, tudo bem?",
    paragrafos: [
      "Eu sei que disse para você que o computador não aguentava criar um site e que aquele projeto tão sonhado não iria rolar. Me perdoa, mas tive que inventar essa desculpa para você não desconfiar! Estive trabalhando nisso nos últimos dias e foi bem difícil, mas fiz tudo com muito carinho, pensando em cada detalhe na mulher linda que você é.",
      "Eu não sou muito bom com palavras, mas, quando o assunto é você, consigo me expressar muito bem pelo simples fato de ser você. O nosso amor foi natural e surgiu de forma espontânea. Mesmo com os dois lados negando no início, continuamos a nos apaixonar um pelo outro, nem que fosse secretamente.",
      "Tenho certeza de que, se não tivesse você do meu lado nestes tempos de estudo, eu teria fraquejado. Com você, pude enxergar o lado bom das coisas e confiar no processo. Mesmo que não tenhamos tanto tempo para conversar, fico sempre ansioso para terminar logo os afazeres e ir falar com você, compartilhando as coisas bobas do meu dia — que, na maioria das vezes, são só sobre os estudos, mas que você escuta com toda atenção.",
      "Você é uma pessoa muito especial para mim e de quem tenho muito orgulho. É uma mulher guerreira, carinhosa, companheira, leal e linda. Tudo o que eu almejei encontrar em uma mulher, eu encontrei em você. Não sei o que o futuro nos reserva, mas quero que, em qualquer caminho que a vida nos leve, eu tenha você ao meu lado."
    ],
    fecho: "Feliz aniversário, meu amor!",
    assinatura: `Com muito amor,<br>${RYAN}`
  },

  /* ---------- 9B. CARTA DE ANIVERSÁRIO (nova) ----------
     Aparece logo depois da carta final. 1 item em "paragrafos" = 1 parágrafo. */
  cartaAniversario: {
    titulo: "Meu presente e minha cartinha",
    intro: "Mais uma carta, escrita com calma, para dizer o que eu sinto e o que eu sonho para nós dois.",
    saudacao: "Meu amor,",
    paragrafos: [
      "Aproveite muito o seu dia! Desejo tudo de bom para você, e que Deus te abençoe e te guarde sempre.",
      "Saiba que estarei com você como sempre estive, nos momentos de tristeza e nos de alegria. Mesmo com rotinas tão diferentes, nós damos o melhor de nós para conseguir conversar e estar presentes um na vida do outro. Sinceramente, não sei como vai ser daqui para frente, com a minha rotina de estudos pós-escola e a sua rotina, mas a única coisa que eu quero é estar ao seu lado.",
      "Quero muito que você prestigie, se Deus quiser, a minha tão sonhada entrada na EFOMM. E quero muito estar presente na sua formatura, um momento tão importante, em que tantos sonhos nossos vão se realizar. Passo a passo, vamos caminhando para a construção do nosso futuro juntos.",
      "Me desculpe se me perdi um pouco e falei mais de nós do que de você nesta carta. Mas, depois de tantos meses juntos, não consigo escrever sobre você sem falar de nós dois como um só.",
      "Enfim, meu bem, este é o meu presente e a minha cartinha para você, onde pude expressar alguns dos meus desejos e sentimentos."
    ],
    fecho: "Feliz aniversário, meu amor!",
    assinatura: `Com amor,<br>${RYAN}`,
    fim: "Palavras simples, mas cada uma delas é verdadeira."
  },

  /* ---------- 10. FINAL ---------- */
  final: { frase: "Se eu pudesse escolher novamente, ainda escolheria conhecer você.",
    foto: "assets/images/foto-final.jpg" },   // opcional (apague a linha para não mostrar foto)

  segredos: [   // aparecem ao tocar nos pequenos corações escondidos pelo site
    "Você achou um! Eu te amo mais do que cabe nesta página.",
    "Psiu: procure os outros corações.",
    "Este é para você lembrar de respirar fundo e sorrir.",
    "O último: eu escolheria você em todas as versões.",
    "Achou mais um! Obrigado por estar ao meu lado nos dias bons e nos difíceis."
  ]
};

/* ================= A PARTIR DAQUI não precisa mexer ================= */
const d = SITE_DATA, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const img = (s, a = '', lazy = true) => `<img src="${s}" alt="${a}" loading="${lazy ? 'lazy' : 'eager'}" onerror="this.outerHTML='<div class=ph>${s}</div>'">`;
const spr = c => `<svg class="sprig ${c}" aria-hidden="true"><use href="#sprig"/></svg>`;
const sec = (c, i) => `<button class="sec ${c}" data-i="${i}" aria-label="Um pequeno segredo"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></button>`;
const P = a => a.map(t => `<p>${t}</p>`).join('');
const S = (id, cls, inner, extra = '') => `<section id="${id}" class="${cls}">${extra}<div class="w">${inner}</div></section>`;
const wv = (c, s) => `<div class="wv${s ? ' s' : ''}" style="--c:${c}" aria-hidden="true"><i></i></div>`;
const cov = (s, eq) => `<span class="cv"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>${s ? `<img src="${s}" alt="" onerror="this.remove()">` : ''}${eq ? '<span class="eq"><i></i><i></i><i></i></span>' : ''}</span>`;
const ICO = '<path class="pl" d="M7 4l13 8-13 8z"/><path class="pa" d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

document.title = `Feliz aniversário, ${d.kamilly}!`;
/* formas das ondas/festões entre as seções */
const mask = p => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 34' preserveAspectRatio='none'><path d='${p}'/></svg>`)}")`;
document.documentElement.style.setProperty('--wave', mask('M0 34V18C150 -2 300 -2 450 14S750 34 900 18 1100 4 1200 14V34z'));
document.documentElement.style.setProperty('--scal', mask('M0 34V22' + 'a50 20 0 0 1 100 0'.repeat(12) + 'V34z'));

const pl = d.playlist;
$('main').innerHTML = [
 /* 1 — tela inicial */
 `<section id="s1" class="hero">${spr('tl')}${spr('br')}<div class="hw"><h1>${d.abertura.titulo}</h1><p class="lead">${d.abertura.texto}</p><button class="btn" id="open"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>${d.abertura.botao}</button></div></section>`,
 wv('var(--cr2)'),
 /* 2 — foto principal */
 S('s2', 'alt2', `<figure class="pol big rv" id="mainph" tabindex="0" role="button" aria-label="Toque na foto para uma surpresa">${img(d.foto.src, 'Foto de ' + d.kamilly, false)}<span class="tap" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#heart"/></svg></span><figcaption><span class="cap1">${d.foto.legenda[0]}</span><span class="cap2">${d.foto.legenda[1]}</span></figcaption></figure><p class="outro rv">${d.foto.texto}</p>`, spr('tr')),
 wv('var(--cr)', 1),
 /* 3 — carta */
 S('s3', '', `<h2 class="rv">${d.carta.titulo}</h2><p class="intro rv">${d.carta.intro}</p><div class="paper rv z">${d.carta.paragrafos.map(t => `<p class="rv">${t}</p>`).join('')}<p class="sign rv">${d.assinatura}</p></div>`, spr('tl') + sec('a', 0)),
 wv('var(--rs)'),
 /* 4 — coisas que eu amo em você */
 S('s4', 'alt', `<h2 class="rv">${d.amo.titulo}</h2><p class="intro rv">${d.amo.intro}</p>${d.amo.itens.map((i, n) => `<article class="lv lv${n % 3 + 1} rv ${['', 'r', 'l'][n % 3]}"><div class="px"><div class="fw"><figure class="fr">${img(i.foto, i.titulo)}</figure></div><h3>${i.titulo}</h3></div><svg class="mini" aria-hidden="true"><use href="#sprig"/></svg></article>`).join('')}<p class="outro up rv">${d.amo.fim}</p>`, spr('br') + sec('b', 1)),
 wv('#4a3330', 1),
 /* 5 — playlist */
 S('s5', 'dark', `<h2 class="rv">${pl.titulo}</h2>
  <div class="plh rv"><div class="plc"><svg class="sp" aria-hidden="true"><use href="#sprig"/></svg><svg class="hg" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg><span class="t">${pl.nome}</span>${pl.capa ? `<img src="${pl.capa}" alt="Capa da playlist" onerror="this.remove()">` : ''}</div>
   <p class="pln">${pl.nome}</p><p class="pld">${pl.descricao}</p>
   <div class="plrow"><p class="pla">${pl.autor}</p><button id="pl-big" class="pbtn gl" aria-label="Tocar playlist"><svg viewBox="0 0 24 24">${ICO}</svg></button></div></div>
  <div id="player" class="rv"><div class="np"><span id="pl-cv"></span><div class="tn"><b id="pl-t"></b><small id="pl-a"></small></div></div>
   <p id="pl-msg" role="status" aria-live="polite"></p>
   <input id="pl-r" type="range" min="0" max="1000" value="0" aria-label="Progresso da música"><div class="tm"><span id="pl-cur">0:00</span><span id="pl-dur">0:00</span></div>
   <div class="ct"><button id="pl-prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
   <button id="pl-pp" class="pp gl" aria-label="Tocar ou pausar"><svg viewBox="0 0 24 24">${ICO}</svg></button>
   <button id="pl-next" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button></div></div>
  <ul class="trks">${pl.itens.map((m, i) => `<li class="trk rv" data-i="${i}"><button class="row" aria-label="Tocar ${m.nome}">${cov(m.capa, true)}<span class="tn"><b>${m.nome}</b><small>${m.artista}</small></span><span class="rb" aria-hidden="true"><svg viewBox="0 0 24 24">${ICO}</svg></span></button></li>`).join('')}</ul><p class="outro rv">${pl.fim}</p>`),
 wv('var(--cr2)'),
 /* 6 — galeria */
 S('s6', 'alt2', `<h2 class="rv">${d.galeria.titulo}</h2><p class="intro rv">${d.galeria.intro}</p><div class="gal">${d.galeria.fotos.map((f, i) => `<button class="gi rv" data-i="${i}" aria-label="Ampliar foto ${i + 1}"><figure class="pol">${img(f, 'Foto de ' + d.kamilly)}</figure></button>`).join('')}</div><p class="outro rv">${d.galeria.fim}</p>`, sec('c', 2)),
 wv('var(--cr)', 1),
 /* 7 — envelopes */
 S('s7', '', `<h2 class="rv">${d.envelopes.titulo}</h2><p class="intro rv">${d.envelopes.intro}</p><div class="envs">${d.envelopes.itens.map(e => `<div class="env rv"><button class="front" aria-expanded="false"><i class="flap"></i><i class="seal"></i>${e.titulo}</button><div class="msg"><div><p>${e.mensagem}</p></div></div></div>`).join('')}</div>`, spr('tr')),
 wv('var(--cr2)'),
 /* 8 — futuro */
 S('s8', 'fut', `<h2 class="rv">${d.futuro.titulo}</h2><div class="rv fp">${P(d.futuro.paragrafos)}</div>`, spr('tl') + sec('d', 3)),
 wv('var(--cr)', 1),
 /* 9 — carta final */
 S('s9', '', `<h2 class="rv">${d.cartaFinal.titulo}</h2><div class="paper rv z"><p class="hi rv">${d.cartaFinal.saudacao}</p>${d.cartaFinal.paragrafos.map(t => `<p class="rv">${t}</p>`).join('')}<p class="fec rv">${d.cartaFinal.fecho}</p><p class="sign rv">${d.cartaFinal.assinatura}</p></div>`, spr('tr')),
 wv('var(--cr2)'),
 /* 9B — carta de aniversário */
 S('s9b', 'alt2', `<h2 class="rv">${d.cartaAniversario.titulo}</h2><p class="intro rv">${d.cartaAniversario.intro}</p><div class="paper rv z"><p class="hi rv">${d.cartaAniversario.saudacao}</p>${d.cartaAniversario.paragrafos.map(t => `<p class="rv">${t}</p>`).join('')}<p class="fec rv">${d.cartaAniversario.fecho}</p><p class="sign rv">${d.cartaAniversario.assinatura}</p></div><p class="outro rv">${d.cartaAniversario.fim}</p>`, spr('tl') + sec('b', 4)),
 wv('var(--rs)', 1),
 /* 10 — final */
 S('s10', 'end', `<p class="to rv">Para ${d.kamilly},</p><p class="quote rv">${d.final.frase}</p><svg class="hb" viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>${d.final.foto ? `<figure class="pol sm2 rv">${img(d.final.foto, '')}</figure>` : ''}`, spr('tl') + spr('br'))
].join('');

/* escalonamento leve das entradas dentro de cada seção */
$$('.w').forEach(w => $$('.rv', w).forEach((e, k) => e.style.transitionDelay = (k % 4) * .09 + 's'));

/* ===== celebração ao tocar na foto: confete, pétalas e corações ===== */
const fx = $('#fx'), rnd = (a, b) => a + Math.random() * (b - a);
const PAL = ['#c98c93', '#e9b8bd', '#e8c872', '#a9b79a', '#b5555d', '#d6a0a6'];
const PET = ['linear-gradient(135deg,#f8d3d6,#d98b95)', 'linear-gradient(135deg,#fbe4e1,#e4a2aa)', 'linear-gradient(135deg,#f3c0c6,#c98c93)'];
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches, K = reduced ? .5 : 1;
const mk = (id, css) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = `<use href="#${id}"/>`; s.style.cssText = css; fx.appendChild(s); return s; };
const fin = (el, kf, o) => el.animate(kf, o).onfinish = () => el.remove();

function confetti(r, n) {   // sai das bordas da foto e cai devagar
  for (let i = 0; i < n; i++) {
    const e = document.createElement('i'), w = rnd(5, 9), a = rnd(0, 6.283), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    e.style.cssText = `left:${cx + Math.cos(a) * r.width * .5}px;top:${cy + Math.sin(a) * r.height * .5}px;width:${w}px;height:${w * rnd(.5, 1.6)}px;background:${PAL[i % PAL.length]};border-radius:${Math.random() < .35 ? '50%' : '1px'}`;
    fx.appendChild(e);
    const dist = rnd(50, 140), dx = Math.cos(a) * dist, dy = Math.sin(a) * dist - rnd(10, 40), rot = rnd(-540, 540);
    fin(e, [{ transform: 'translate(0,0) rotate(0) scale(.3)', opacity: 0 }, { transform: `translate(${dx * .7}px,${dy * .7}px) rotate(${rot * .4}deg) scale(1)`, opacity: 1, offset: .25 }, { transform: `translate(${dx}px,${dy + rnd(90, 220)}px) rotate(${rot}deg) scale(.9)`, opacity: 0 }], { duration: rnd(1500, 2600), easing: 'cubic-bezier(.2,.7,.3,1)' });
  }
}
function petals(n) {   // pétalas delicadas caindo pela tela
  const H = innerHeight;
  for (let i = 0; i < n; i++) {
    const w = rnd(10, 17), e = document.createElement('i'), sw = rnd(30, 90) * (i % 2 ? 1 : -1);
    e.className = 'pt'; e.style.cssText = `left:${rnd(0, 100)}%;width:${w}px;height:${w * 1.3}px;background:${PET[i % 3]}`; fx.appendChild(e);
    fin(e, [{ transform: 'translate(0,0) rotate(0deg)', opacity: 0 }, { opacity: .9, offset: .1 }, { transform: `translate(${sw}px,${H * .5}px) rotate(${rnd(150, 260)}deg)`, opacity: .9, offset: .55 }, { transform: `translate(${-sw * .4}px,${H + 40}px) rotate(${rnd(380, 620)}deg)`, opacity: .7 }], { duration: rnd(3600, 5600), delay: rnd(0, 1100), easing: 'ease-in-out', fill: 'backwards' });
  }
}
function rise(r, n) {   // corações e brilhos subindo ao redor da foto
  for (let i = 0; i < n; i++) {
    const star = i % 3 === 0, sz = rnd(10, 20);
    const s = mk(star ? 'star' : 'heart', `left:${rnd(r.left, r.right)}px;top:${rnd(r.top + r.height * .2, r.bottom)}px;width:${sz}px;height:${sz}px;fill:${star ? '#e8c872' : PAL[i % 2]}`);
    fin(s, [{ transform: 'translate(0,0) scale(.2) rotate(0)', opacity: 0 }, { opacity: .95, offset: .2 }, { transform: `translate(${rnd(-30, 30)}px,${-rnd(70, 170)}px) scale(1) rotate(${rnd(-25, 25)}deg)`, opacity: 0 }], { duration: rnd(1600, 2600), delay: rnd(0, 500), easing: 'ease-out', fill: 'backwards' });
  }
}
function pop(x, y, n) {   // explosão pequena de corações (botão de abrir)
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), dist = rnd(50, 120), star = i % 3 === 0, sz = rnd(10, 18);
    const s = mk(star ? 'star' : 'heart', `left:${x - sz / 2}px;top:${y - sz / 2}px;width:${sz}px;height:${sz}px;fill:${star ? '#e8c872' : PAL[i % 2]}`);
    fin(s, [{ transform: 'translate(0,0) scale(.3)', opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist - 40}px) scale(1)`, opacity: 0 }], { duration: rnd(900, 1400), easing: 'cubic-bezier(.2,.7,.3,1)' });
  }
}
let lastFx = 0;
function celebrate(fig) {
  if (Date.now() - lastFx < 900) return; lastFx = Date.now();
  fig.classList.add('done');
  fig.animate([{ transform: 'rotate(-1.5deg) scale(1)' }, { transform: 'rotate(.6deg) scale(1.035)' }, { transform: 'rotate(-1.5deg) scale(1)' }], { duration: 700, easing: 'ease-in-out' });
  const r = fig.getBoundingClientRect();
  confetti(r, Math.round(36 * K)); petals(Math.round(20 * K)); rise(r, Math.round(11 * K));
}
const mp = $('#mainph');
mp.addEventListener('click', () => celebrate(mp));
mp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); celebrate(mp); } });

/* botão "Abrir meu presente": explosão de corações e rolagem suave até a foto */
$('#open').onclick = e => {
  const b = e.currentTarget, r = b.getBoundingClientRect();
  b.classList.add('pop'); pop(r.left + r.width / 2, r.top + r.height / 2, Math.round(16 * K));
  setTimeout(() => $('#s2').scrollIntoView({ behavior: 'smooth' }), 420);
  setTimeout(() => b.classList.remove('pop'), 900);
};

/* navegação, segredos, envelopes */
let tt; const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 4000); };
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) $(g.dataset.go).scrollIntoView({ behavior: 'smooth' });
  const s = e.target.closest('.sec'); if (s) toast(d.segredos[s.dataset.i] || '');
  const f = e.target.closest('.gi'); if (f) openLb(+f.dataset.i);
  const v = e.target.closest('.env .front'); if (v) { const o = v.parentNode.classList.toggle('open'); v.setAttribute('aria-expanded', o); }
  if (lb.classList.contains('on') && e.target.id !== 'lb-p' && e.target.id !== 'lb-n' && !e.target.closest('#lb-f img,#lb-f .ph') && e.target.closest('#lb')) closeLb();
});

/* galeria: ampliar com transição suave, setas, teclado e deslizar */
const lb = $('#lb'), F = d.galeria.fotos; let lbi = 0, tx = 0, ty = 0;
const shw = (n, anim) => { lbi = (n + F.length) % F.length; $('#lb-f').innerHTML = img(F[lbi], 'Foto ampliada', false); if (anim) $('#lb-f').animate([{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'ease-out' }); };
function openLb(i) { shw(i); lb.classList.add('on'); document.body.style.overflow = 'hidden'; }
function closeLb() { lb.classList.remove('on'); document.body.style.overflow = ''; }
$('#lb-p').onclick = () => shw(lbi - 1, 1); $('#lb-n').onclick = () => shw(lbi + 1, 1);
addEventListener('keydown', e => { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') shw(lbi - 1, 1); if (e.key === 'ArrowRight') shw(lbi + 1, 1); });
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
lb.addEventListener('touchend', e => { const x = e.changedTouches[0].clientX - tx, y = e.changedTouches[0].clientY - ty; if (Math.abs(x) > 50 && Math.abs(x) > Math.abs(y)) shw(lbi + (x < 0 ? 1 : -1), 1); else if (y > 90) closeLb(); });

/* player de músicas (nunca toca sozinho; uma música por vez) */
const au = Object.assign(new Audio(), { preload: 'metadata' }), L = pl.itens, R = $('#pl-r'), root = $('#s5'); let cur = -1, drag = false;
const fm = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
const setP = v => R.style.setProperty('--p', v / 10 + '%');
const nav = 'mediaSession' in navigator;
function sync() {
  root.classList.toggle('playing', !au.paused);
  $$('.trk').forEach((e, j) => $('.row', e).setAttribute('aria-label', (j === cur && !au.paused ? 'Pausar ' : 'Tocar ') + L[j].nome));
  um();
}
function load(i) {
  cur = (i + L.length) % L.length; const m = L[cur]; au.src = m.arquivo;
  $('#pl-cv').innerHTML = cov(m.capa); $('#pl-t').textContent = m.nome; $('#pl-a').textContent = m.artista;
  $$('.trk').forEach((e, j) => e.classList.toggle('on', j === cur));
  R.value = 0; setP(0); $('#pl-cur').textContent = '0:00'; $('#pl-dur').textContent = '0:00'; $('#pl-msg').textContent = '';
  if (nav) navigator.mediaSession.metadata = new MediaMetadata({ title: m.nome, artist: m.artista, album: pl.nome, artwork: m.capa ? [{ src: m.capa }] : [] });
  sync();
}
const play = i => { if (i !== cur) load(i); const p = au.play(); p && p.catch(() => { }); };
const toggle = i => (i === cur && !au.paused) ? au.pause() : play(i);
const prev = () => au.currentTime > 3 ? au.currentTime = 0 : play(cur - 1);
au.addEventListener('play', sync); au.addEventListener('pause', sync);
au.addEventListener('timeupdate', () => { if (!drag && au.duration) { R.value = au.currentTime / au.duration * 1000; setP(R.value); } $('#pl-cur').textContent = fm(au.currentTime); });
au.addEventListener('loadedmetadata', () => $('#pl-dur').textContent = fm(au.duration));
au.addEventListener('durationchange', () => $('#pl-dur').textContent = fm(au.duration));
au.addEventListener('ended', () => cur < L.length - 1 ? play(cur + 1) : (load(0), sync()));
au.addEventListener('error', () => { $('#pl-msg').textContent = 'Esta música ainda não foi adicionada.'; console.warn('MP3 não encontrado:', L[cur] && L[cur].arquivo); sync(); });
R.addEventListener('input', () => { drag = true; setP(R.value); if (au.duration) au.currentTime = R.value / 1000 * au.duration; $('#pl-cur').textContent = fm(au.currentTime); });
['change', 'pointerup', 'touchend'].forEach(t => R.addEventListener(t, () => drag = false));
$('#pl-pp').onclick = $('#pl-big').onclick = () => toggle(Math.max(cur, 0));
$('#pl-prev').onclick = prev; $('#pl-next').onclick = () => play(cur + 1);
$$('.trk').forEach(e => $('.row', e).onclick = () => toggle(+e.dataset.i));
if (nav) [['play', () => play(Math.max(cur, 0))], ['pause', () => au.pause()], ['previoustrack', prev], ['nexttrack', () => play(cur + 1)]].forEach(([a, f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) { } });

/* mini-player: aparece enquanto a música toca e o player principal está fora da tela */
const mini = $('#mini'); let pv = true;
function um() { mini.classList.toggle('on', !au.paused && !pv); $('#mn').textContent = L[cur] ? L[cur].nome + ' · ' + L[cur].artista : ''; }
new IntersectionObserver(e => { pv = e[0].isIntersecting; um(); }).observe($('#player'));
$('#mp').onclick = () => au.pause();
if (L.length) load(0);

/* revelar ao rolar (entradas), seções (enfeites), progresso, voltar ao topo, pétalas de fundo */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' });
$$('.rv').forEach(e => io.observe(e));
const so = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('vis')), { threshold: .08 });
$$('section').forEach(e => so.observe(e));
$('#petals').innerHTML = Array.from({ length: 12 }, () => `<i style="left:${Math.random() * 100}%;animation-duration:${16 + Math.random() * 12}s;animation-delay:${-Math.random() * 24}s;--s:${.6 + Math.random() * .7}"></i>`).join('');

/* paralaxe sutil (profundidade): enfeites, título inicial e molduras de "Coisas que eu amo" */
const bar = $('#bar'), top_ = $('#top'), HW = $('.hw'), SP = $$('.sprig'), LV = $$('.lv .px'); let tk = 0;
function par() {
  const h = innerHeight, y = scrollY;
  bar.style.transform = `scaleX(${y / (document.documentElement.scrollHeight - h) || 0})`;
  top_.classList.toggle('on', y > h * 1.2);
  if (reduced) return;
  HW.style.translate = `0 ${Math.min(y, h) * .18}px`; HW.style.opacity = Math.max(0, 1 - y / (h * .8));
  SP.forEach(e => { const r = e.parentNode.getBoundingClientRect(); if (r.bottom < -60 || r.top > h + 60) return; e.style.translate = `0 ${(r.top + r.height / 2 - h / 2) * (e.classList.contains('br') ? -.06 : .06)}px`; });
  LV.forEach((e, i) => { const r = e.getBoundingClientRect(); if (r.bottom < 0 || r.top > h) return; e.style.translate = `0 ${(r.top + r.height / 2 - h / 2) * (i % 2 ? .05 : -.05)}px`; });
}
addEventListener('scroll', () => tk || (tk = requestAnimationFrame(() => { tk = 0; par(); })), { passive: true });
addEventListener('resize', par); par();
top_.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
</script><script>
/* LOGIN — troque usuário/senha aqui (proteção simples, feita no navegador) */
(function(){const U='kamilly',P='12345',lg=document.getElementById('lg'),f=document.getElementById('lg-f'),e=document.getElementById('lg-e');
const ok=()=>{try{return sessionStorage.getItem('lg')==='1'}catch(_){return false}};
const done=()=>{lg.classList.add('out');document.documentElement.style.overflow='';setTimeout(()=>lg.remove(),1000)};
if(ok()){lg.remove();return}
document.documentElement.style.overflow='hidden';
f.addEventListener('submit',ev=>{ev.preventDefault();
 const u=document.getElementById('lg-u').value.trim().toLowerCase(),p=document.getElementById('lg-p').value;
 if(u===U&&p===P){try{sessionStorage.setItem('lg','1')}catch(_){}done()}
 else{e.textContent='Usuário ou senha incorretos.';lg.classList.remove('err');void lg.offsetWidth;lg.classList.add('err')}});
setTimeout(()=>{const i=document.getElementById('lg-u');i&&i.focus({preventScroll:true})},300)})();
</script>
</body></html>
